<!DOCTYPE html>
<html>
<head>
    <title>Different Ways of Referencing Colors</title>
    <style>
        .name {
            color: red;
        }
        .hex {
            color:#0000FF;
        }
        .rgb {
            color: rgb(0, 128, 0);
        }
        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }
        .hsl {
            color: hsl(300, 100%, 50%);
        }
    </style>
</head>
<body>
    <h1>CSS Color References</h1>
    <p class="name">
        This text uses Color Name: Red
    </p>
    <p class="hex">
        This text uses HEX Value: Blue
    </p>
    <p class="rgb">
        This text uses RGB Value: Green
    </p>
    <p class="rgba">
        This text uses RGBA Value: Red with Transparency
    </p>
    <p class="hsl">
        This text uses HSL Value: Purple
    </p>
</body>
</html>
