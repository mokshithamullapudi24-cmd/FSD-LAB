<!DOCTYPE html>
<html>
<head>
    <title>Background Image</title>
    <style>
        body {
            margin: 0;
            min-height: 1200px;
            background-image: url("image.jpg");
            background-repeat: no-repeat;
            background-position: center 50%;
            background-size: 400px 300px;
            background-attachment: fixed;
        }
        h1 {
            text-align: center;
        }
        p {
            margin-top: 300px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Background Image Example</h1>
    <p>
        This webpage contains a background image positioned
        halfway down the page.
    </p>
    <p>
        Scroll the page to see that the background image remains fixed.
    </p>
</body>
</html>
